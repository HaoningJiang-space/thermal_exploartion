[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-exploration"
version = "0.1.0"
description = "Falsifiable compute-memory locality experiments for hybrid-bonded 3D accelerators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7"]

[project.scripts]
thermal-pilot = "thermal_exploration.run:main"

[tool.setuptools.packages.find]
include = ["thermal_exploration*"]
